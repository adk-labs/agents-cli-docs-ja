[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "google-agents-cli"
version = "0.1.0"
description = "Unified CLI for the full ADK agent development lifecycle"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "jinja2",
    "cookiecutter",
    "backoff",
    "fastapi",
    "httpx",
    "locust",
    "packaging",
    "pathspec",
    "psutil",
    "pytest",
    "python-dotenv",
    "requests",
    "google-auth",
    "google-api-python-client",
]

[project.scripts]
agents = "google.agents.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/google"]
